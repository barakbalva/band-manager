<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111114">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>BandBase</title>
<style>
:root{--bg:#111114;--panel:#1b1b20;--panel2:#24242b;--line:#33333c;--text:#ececf1;--muted:#9a9aa6;--accent:#f5a524;--accent-ink:#1a1200;--danger:#ef5b5b;--ok:#3ecf8e;--r:12px;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Hebrew",sans-serif}
html{overscroll-behavior-y:none}
/* nothing may be wider than the screen: on an iPhone that lets the whole view slide, pushing sheet headers under the status bar */
/* clip, not hidden: overflow-x:hidden on html+body turns body into its own scroll box, and Android Chrome then scrolls badly */
html,body{overflow-x:clip}
@supports not (overflow-x:clip){body{overflow-x:hidden}}
.grid2>*,.grid3>*{min-width:0}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-width:0;min-height:44px;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--accent)}
.hidden{display:none!important}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:8px}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* header + nav */
header{position:sticky;top:0;z-index:5;background:rgba(17,17,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 10px}
header h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
.bandsel{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-weight:700;max-width:60vw}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex:none}
main{padding:12px 14px calc(90px + var(--safe-b));max-width:860px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:rgba(20,20,24,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
nav.tabs button{flex:1;padding:10px 4px 9px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button.on{color:var(--accent)}

/* controls */
.btn{white-space:nowrap;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn svg{width:20px;height:20px;flex:none}
a.btn{text-decoration:none;color:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:6px 10px;font-size:14px}
.btn:disabled{opacity:.5}
.icon{width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;color:var(--text)}
.icon:active{background:var(--panel2)}
.icon svg{width:22px;height:22px}
input[type=text],input[type=password],input[type=email],input[type=number],input[type=date],input[type=time],input[type=search],input[type=url],select,textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:120px;resize:vertical}
textarea.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;min-height:220px;white-space:pre;overflow-wrap:normal;overflow-x:auto}
label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:13px;color:var(--muted);margin:0 0 5px}
label.f.row>span{display:inline;color:var(--text);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 10px}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 11px;border-radius:8px;color:var(--muted);font-size:14px}
.seg button.on{background:var(--panel2);color:var(--text)}

/* lists */
.toolbar{display:flex;gap:8px;align-items:center;margin:2px 0 12px}
.list{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list>li{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.list>li.tap:active{background:var(--panel2)}
.title{font-weight:600}
.chips{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.chip{direction:ltr;unicode-bidi:isolate;font-size:12px;padding:2px 7px;border-radius:6px;background:var(--panel2);color:var(--muted);white-space:nowrap}
.chip.k{color:var(--accent)}
.chip.learn{color:#7cc4ff}
.chip.park{color:var(--muted);text-decoration:line-through}
.evd{width:42px;flex:none;text-align:center}.evd b{display:block;font-size:20px;line-height:1.1}.evd span{font-size:12px;color:var(--muted)}
.mail-li.unread .title{font-weight:800}.mail-li.unread .evd b{color:var(--accent)}
.mail-body{white-space:pre-wrap;word-break:break-word;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;font-size:15px}
.mail-meta{font-size:13px;color:var(--muted);margin:0 0 10px;word-break:break-word}
.calbox textarea.script{width:100%;min-height:160px;font:12px/1.35 ui-monospace,Menlo,monospace;direction:ltr;text-align:left}
.pj-over{color:var(--danger)!important;font-weight:700}
.task-ed{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
.task-ed.done .tt{text-decoration:line-through;color:var(--muted)}
.task-ed .icon{width:34px;height:34px}
nav.tabs button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.chip.t-gig{color:var(--accent)}.chip.t-rehearsal{color:#7cc4ff}
.calbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.calbox code{display:block;direction:ltr;text-align:left;word-break:break-all;background:var(--panel2);padding:8px;border-radius:8px;margin:6px 0;font-size:13px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
.count{font-size:13px;color:var(--muted);margin:14px 2px 6px;display:flex;justify-content:space-between}

/* setlist editor */
.entries>li{padding:8px 8px 8px 4px;gap:6px;background:var(--panel);touch-action:pan-y}
.entries>li.brk{background:var(--panel2)}
.entries>li.dragging{opacity:.85;outline:2px solid var(--accent);outline-offset:-2px;position:relative;z-index:2}
.handle{width:34px;height:38px;display:flex;align-items:center;justify-content:center;color:var(--muted);touch-action:none;cursor:grab;flex:none}
.handle svg{width:20px;height:20px}
.num{width:24px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;flex:none;font-size:14px}
.settotal{font-size:13px;color:var(--muted)}
.dur{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;flex:none}

/* sheet (modal) */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;
 /* keep the sheet's top row (close, stage mode…) below the status bar / notch in the installed app */
 padding-top:max(6vh,calc(env(safe-area-inset-top,0px) + 10px))}
.sheet{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;width:100%;max-width:720px;max-height:100%;display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:17px;margin:0;flex:1}
.sheet-b{overflow:auto;flex:1 1 auto;min-height:0;overscroll-behavior:contain;padding:14px;padding-bottom:calc(20px + var(--safe-b))}
@media (min-width:760px){.sheet-bg{align-items:center}.sheet{border-radius:18px;border-bottom:1px solid var(--line)}}

/* login */
.auth{max-width:380px;margin:9vh auto 0;padding:0 18px}
.auth .logo{width:64px;height:64px;margin:0 auto 14px;display:block}
.auth h1{text-align:center;font-size:24px;margin:0 0 4px}
.auth p{text-align:center}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:4px 0}

/* stage mode */
#stage{position:fixed;inset:0;z-index:40;background:#000;color:#fff;display:flex;flex-direction:column}
.st-top{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 6px) 8px 6px;color:#aaa;font-size:14px;border-bottom:1px solid #222}
.st-top .icon{color:#ccc;width:38px;height:38px}
.st-pill{padding:4px 9px;border-radius:20px;border:1px solid #333;font-size:13px;color:#bbb}
.st-pill.on{border-color:var(--accent);color:var(--accent)}
.st-pill.live{border-color:var(--ok);color:var(--ok)}
.st-main{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:14px 18px 20px}
.st-pos{color:#888;font-size:15px;font-variant-numeric:tabular-nums}
.st-title{font-size:clamp(30px,7vw,64px);font-weight:800;line-height:1.1;margin:4px 0 6px}
.st-artist{color:#999;font-size:clamp(16px,3vw,24px);margin-bottom:10px}
.st-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.st-meta span{direction:ltr;unicode-bidi:isolate;font-size:clamp(18px,3.4vw,30px);font-weight:700;padding:4px 12px;border-radius:10px;background:#161616;border:1px solid #2a2a2a}
.st-meta .key{color:var(--accent)}
.st-notes{font-size:clamp(17px,2.8vw,24px);color:#ffd27a;margin:0 0 14px;white-space:pre-wrap}
.part-ed{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px 8px;margin-bottom:8px}
.part-ed .icon{width:32px;height:32px;font-size:12px;color:var(--muted)}
.part-ed .pc{font-family:ui-monospace,Menlo,Consolas,monospace;margin-top:4px}
.part-ed .pt{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--accent);margin-top:5px;font-size:15px}
.st-parts{display:grid;gap:8px;margin:0 0 16px}
.st-part{display:flex;gap:12px;align-items:baseline;background:#111;border:1px solid #222;border-radius:10px;padding:8px 12px}
.st-part span{color:#999;font-size:clamp(14px,2.4vw,18px);min-width:5.5em}
.st-part b{font-family:ui-monospace,Menlo,Consolas,monospace;color:var(--accent);font-size:clamp(20px,3.6vw,32px);font-weight:700;word-spacing:.3em}
.st-text{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;line-height:1.35;color:#eee}
.st-break{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;text-align:center}
.st-break b{font-size:clamp(34px,8vw,70px)}
.st-bot{display:flex;align-items:stretch;border-top:1px solid #222;padding-bottom:var(--safe-b)}
.st-bot button{padding:16px 10px;color:#ddd;font-size:16px}
.st-bot .prev{width:28%;border-right:1px solid #222}
.st-bot .next{flex:1;min-width:0;overflow:hidden;text-align:start;display:flex;align-items:center;gap:10px}
.st-bot .next small{display:block;color:#777;font-size:12px}
.st-bot .next b{display:block;font-size:20px}
.beat{width:16px;height:16px;border-radius:50%;background:#333;flex:none;transition:background .05s}
.beat.on{background:var(--accent)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%);background:#2b2b33;border:1px solid var(--line);padding:9px 14px;border-radius:10px;z-index:60;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw}
#toast.show{opacity:1}
.offline{background:#3a2a0a;color:#ffcf7a;font-size:13px;text-align:center;padding:4px}

/* print */
#print{display:none}
@media print{
 body>*:not(#print){display:none!important}
 #print{display:block;color:#000;background:#fff;font-family:Arial,Helvetica,sans-serif}
 #print h1{font-size:26pt;margin:0 0 2pt}
 #print .sub{font-size:13pt;margin:0 0 12pt;color:#333}
 #print ol{margin:0;padding-left:0;list-style:none}
 #print li{font-size:24pt;font-weight:700;line-height:1.25;display:flex;gap:10pt;align-items:baseline}
 #print li .n{width:30pt;color:#666;font-size:16pt}
 #print li .k{font-size:15pt;font-weight:400;color:#444;margin-left:auto}
 #print li.b{font-size:15pt;font-weight:400;color:#555;border-top:2px solid #000;margin:10pt 0 6pt;padding-top:4pt}
 html,body{background:#fff}
}
[dir=rtl] .st-bot .prev{border-right:0;border-left:1px solid #222}
[dir=rtl] .flip svg{transform:scaleX(-1)}
</style>
</head>
<body>

<div id="app"></div>
<div id="toast"></div>
<div id="print"></div>

async function boot(){
 if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(()=>{});
 tabFromHash();
 if (sessionStorage.getItem('reset')) return renderReset();
 try { S.state = await api('/api/state'); S.offline = false; }
 catch(e){ S.offline = true; S.state = JSON.parse(localStorage.getItem('state') || 'null'); }
 if (S.state && S.state.me) localStorage.setItem('state', JSON.stringify(S.state));
 if (!S.state) return renderLogin(false, true);
 if (S.state.setup) return renderSetup();
 const inv = sessionStorage.getItem('invite');
 if (inv && !S.offline){
  if (!(S.state.me && S.state.me.user)) return renderLogin(false, false, 'signup');
  sessionStorage.removeItem('invite');
  try { const r = await api('/api/invite/' + inv, { method:'POST' }); localStorage.setItem('band', r.band); S.state = await api('/api/state'); setTimeout(() => toast(t('joinedBand')), 300); }
  catch(e){ setTimeout(() => toast(t('inviteBad')), 300); }
 }
 if (!S.state.me) return renderLogin();
 const bands = S.state.bands || [];
 if (!bands.length) return S.state.me.user ? renderNoBand() : renderLogin();
 const want = localStorage.getItem('band');
 S.band = bands.find(b => b.id === want) || bands[0];
 await loadBand();
 render();
 refreshPush();
}

async function loadBand(){
 try { S.data = await api('/api/band/' + S.band.id); S.offline = false; localStorage.setItem(bandKey(S.band.id), JSON.stringify(S.data)); }
 catch(e){
  if (e.status === 401 || e.status === 403){ S.state.me = null; return renderLogin(); }
  S.offline = true; S.data = JSON.parse(localStorage.getItem(bandKey(S.band.id)) || 'null') || { band:S.band, songs:[], setlists:[], events:[], projects:[] };
 }
 $('#offline').textContent = t('offline'); $('#offline').classList.toggle('hidden', !S.offline);
}

async function saveItem(kind, item){
 const { id, updated, by, ...data } = item;
 const r = await api(`/api/band/${S.band.id}/item`, { method:'PUT', body:{ kind, id, data } });
 item.id = r.id; item.updated = r.updated; item.by = S.state.me.name;
 const arr = S.data[kind + 's']; const i = arr.findIndex(x => x.id === r.id);
 if (i >= 0) arr[i] = item; else arr.push(item);
 localStorage.setItem(bandKey(S.band.id), JSON.stringify(S.data));
 return item;
}
async function deleteItem(kind, id){
 await api(`/api/band/${S.band.id}/item/${id}`, { method:'DELETE' });
 S.data[kind + 's'] = S.data[kind + 's'].filter(x => x.id !== id);
 localStorage.setItem(bandKey(S.band.id), JSON.stringify(S.data));
}
const songById = id => S.data.songs.find(s => s.id === id);

// ---------- metronome click (Web Audio); first beat of each bar is higher ----------
const Click = { ac:null, t:null, n:0,
 get on(){ return !!this.t; },
 start(bpm){ this.stop(); if (!(bpm >= 20 && bpm <= 400)) return; const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
  this.ac = this.ac || new AC(); this.ac.resume(); this.n = 0;
  const tick = () => { const c = this.ac, o = c.createOscillator(), g = c.createGain(), now = c.currentTime;
   o.frequency.value = this.n++ % 4 === 0 ? 1600 : 1050; g.gain.setValueAtTime(0.0001, now); g.gain.exponentialRampToValueAtTime(0.7, now + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, now + 0.05);
   o.connect(g).connect(c.destination); o.start(now); o.stop(now + 0.06); };
  tick(); this.t = setInterval(tick, 60000 / bpm); },
 stop(){ clearInterval(this.t); this.t = null; } };

// ---------- songs ----------
function songChips(s){
 return `${s.key?`<span class="chip k">${esc(s.key)}${s.shift?` <span class="muted">${fmtShift(s.shift)}</span>`:''}</span>`:''}${s.bpm?`<span class="chip">${esc(s.bpm)} bpm</span>`:''}${s.tuning?`<span class="chip">${esc(s.tuning)}</span>`:''}${s.status==='learning'?`<span class="chip learn">${t('learning')}</span>`:''}${s.status==='parked'?`<span class="chip park">${t('parked')}</span>`:''}${s.practice?`<span class="chip" style="color:var(--danger)">${t('practiceF')}</span>`:''}`;
}
function renderSongs(){
 const q = S.q.toLowerCase();
 let songs = S.data.songs.filter(s => (!q || (s.title + ' ' + (s.artist||'')).toLowerCase().includes(q)) && (!S.practice || s.practice));
 const rank = { active:0, learning:1, parked:2 };
 songs.sort(S.sort === 'recent' ? (a,b) => (b.updated||0) - (a.updated||0)
  : S.sort === 'status' ? (a,b) => (rank[a.status||'active'] - rank[b.status||'active']) || coll.compare(a.title, b.title)
  : (a,b) => coll.compare(a.title, b.title));
 const total = S.data.songs.filter(s => (s.status||'active') === 'active').reduce((a,s) => a + (+s.duration||0), 0);
 $('#main').innerHTML = `<div class="toolbar"><input type="search" id="q" placeholder="${t('search')}" value="${esc(S.q)}"></div>
  <div class="toolbar"><div class="seg" id="sortseg">${[['title',t('sortTitle')],['recent',t('sortRecent')],['status',t('sortStatus')]].map(([k,l]) => `<button data-s="${k}" class="${S.sort===k?'on':''}">${l}</button>`).join('')}</div><span class="grow"></span><button class="st-pill ${S.practice?'on':''}" id="prf" style="padding:6px 11px">${t('practiceF')}</button></div>
  ${S.data.songs.length ? `<div class="count"><span>${S.data.songs.length} ${t('songsN')}</span><span>${t('active')}: ${fmtDur(total)}</span></div>
  <ul class="list" id="sl">${songs.map(s => `<li class="tap" data-id="${s.id}"><div class="grow"><div class="title ell" dir="auto">${esc(s.title)}</div><div class="row" style="gap:6px;margin-top:3px"><span class="muted small ell" dir="auto" style="flex:0 1 auto">${esc(s.artist||'')}</span><span class="chips">${songChips(s)}</span></div></div><span class="dur">${fmtDur(s.duration)}</span></li>`).join('')}</ul>`
  : `<div class="empty">${t('noSongs')}<br><br><button class="btn primary" id="add2">${I.plus} ${t('addSong')}</button></div>`}`;
 const qi = $('#q'); qi.oninput = () => { S.q = qi.value; const pos = qi.selectionStart; renderSongs(); const n = $('#q'); n.focus(); n.setSelectionRange(pos,pos); };
 $('#sortseg').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.sort = b.dataset.s; localStorage.setItem('sort', S.sort); renderSongs(); };
 $('#prf').onclick = () => { S.practice = !S.practice; renderSongs(); };
 const sl = $('#sl'); if (sl) sl.onclick = e => { const li = e.target.closest('li'); if (li) editSong(songById(li.dataset.id)); };
 const a2 = $('#add2'); if (a2) a2.onclick = () => editSong();
}

function sheet(title, html, opts = {}){
 const bg = document.createElement('div'); bg.className = 'sheet-bg';
 bg.innerHTML = `<div class="sheet"><div class="sheet-h"><button class="icon" data-close aria-label="close">${I.x}</button><h2 class="ell">${esc(title)}</h2>${opts.actions||''}</div><div class="sheet-b">${html}</div></div>`;
 document.body.appendChild(bg); document.body.style.overflow = 'hidden';
 const close = () => { bg.remove(); if (!$('.sheet-bg')) document.body.style.overflow = ''; opts.onClose && opts.onClose(); };
 bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) close(); });
 return { el: bg, close };
}

// pointer-based drag (works with touch). Moves DOM rows live, commits on release.
function enableDrag(ul, onMove){
 ul.addEventListener('pointerdown', e => {
  const h = e.target.closest('.handle'); if (!h) return;
  e.preventDefault();
  const li = h.closest('li'); const from = [...ul.children].indexOf(li);
  li.classList.add('dragging');
  const move = ev => {
   const y = ev.clientY;
   const rows = [...ul.children].filter(x => x !== li && !x.classList.contains('hidden'));
   for (const r of rows){ const b = r.getBoundingClientRect();
    if (y > b.top && y < b.bottom){ if (y < b.top + b.height/2) ul.insertBefore(li, r); else ul.insertBefore(li, r.nextSibling); break; } }
   const sb = ul.closest('.sheet-b'); if (sb){ const sr = sb.getBoundingClientRect(); if (y < sr.top + 50) sb.scrollTop -= 12; else if (y > sr.bottom - 50) sb.scrollTop += 12; }
  };
  const up = () => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
   li.classList.remove('dragging'); const to = [...ul.children].indexOf(li); if (to !== from) onMove(from, to); };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
 });
}

// ---------- stage mode ----------
let stageCtx = null;
function stageMode(sl){

 const ctx = stageCtx = { sl, items, i:0, font: +(localStorage.getItem('stfont') || 20), lead:false, follow:false, beat: localStorage.getItem('stbeat') === '1', click: localStorage.getItem('stclick') === '1', midi:null, wake:null, poll:null, beatT:null, lastLive:0 };

    `<div class="st-pos">${esc(sl.name||'')}</div><div class="st-title" dir="auto">${esc(it.title)}</div>${it.artist?`<div class="st-artist" dir="auto">${esc(it.artist)}</div>`:''}
     <div class="st-meta">${it.key?`<span class="key">${esc(it.key)}${it.shift?` <small style="color:#888;font-weight:400">${fmtShift(it.shift)}</small>`:''}</span>`:''}${it.bpm?`<span>${esc(it.bpm)} bpm</span>`:''}${it.tuning?`<span>${esc(it.tuning)}</span>`:''}${it.duration?`<span>${fmtDur(it.duration)}</span>`:''}</div>

     ${it.chords?`<div class="st-text" dir="ltr" style="font-size:${ctx.font}px">${esc(shiftChordText(it.chords, +it.shift || 0, useFlats(it.key)))}</div>`:''}`}</div>
   <div class="st-bot"><button class="prev flip" id="sp" ${ctx.i<=0?'disabled style="opacity:.3"':''}>${I.back}</button>

// ---------- inbox (mail of the band's Gmail, pushed in by an Apps Script running in that Gmail) ----------
const gmailScript = (url, token) => `// BandBase: sends new mail from this Gmail to the band app every 5 minutes.
// Run "setup" once. To stop: delete this project (or its trigger).
var APP_URL = '${url}';
var TOKEN = '${token}';

function setup() {
  ScriptApp.getProjectTriggers().forEach(function (t) { ScriptApp.deleteTrigger(t); });
  ScriptApp.newTrigger('syncInbox').timeBased().everyMinutes(5).create();
  ScriptApp.newTrigger('backupToDrive').timeBased().onWeekDay(ScriptApp.WeekDay.MONDAY).atHour(5).create();
  syncInbox();
  backupToDrive();
}

// weekly copy of the band's data in this account's Google Drive, folder "BandBase backups" (last 12 kept)
function backupToDrive() {
  var r = UrlFetchApp.fetch(APP_URL + '/backup', { headers: { 'x-inbox-token': TOKEN }, muteHttpExceptions: true });
  if (r.getResponseCode() !== 200) throw new Error('Band app answered ' + r.getResponseCode());
  var it = DriveApp.getFoldersByName('BandBase backups');
  var folder = it.hasNext() ? it.next() : DriveApp.createFolder('BandBase backups');
  folder.createFile('backup-' + new Date().toISOString().slice(0, 10) + '.json', r.getContentText(), 'application/json');
  var files = [], fi = folder.getFiles();
  while (fi.hasNext()) files.push(fi.next());
  files.sort(function (a, b) { return b.getDateCreated() - a.getDateCreated(); });
  files.slice(12).forEach(function (f) { f.setTrashed(true); });
}

function syncInbox() {
  var props = PropertiesService.getScriptProperties();
  var last = Number(props.getProperty('last') || (Date.now() - 14 * 864e5));
  var from = last - 15 * 60e3; // overlap; the app ignores mail it already has
  var started = Date.now(), out = [];
  GmailApp.search('in:inbox after:' + Math.floor(from / 1000), 0, 100).forEach(function (th) {
    th.getMessages().forEach(function (m) {
      if (m.getDate().getTime() < from) return;
      out.push({ id: m.getId(), thread: th.getId(), from: m.getFrom(), to: m.getTo(), cc: m.getCc(), subject: m.getSubject(),
        date: m.getDate().toISOString(), text: m.getPlainBody().slice(0, 60000),
        attachments: m.getAttachments().map(function (a) { return a.getName(); }) });
    });
  });
  for (var i = 0; i < out.length; i += 20) {
    var r = UrlFetchApp.fetch(APP_URL, { method: 'post', contentType: 'application/json', headers: { 'x-inbox-token': TOKEN },
      payload: JSON.stringify({ messages: out.slice(i, i + 20) }), muteHttpExceptions: true });
    if (r.getResponseCode() !== 200) throw new Error('Band app answered ' + r.getResponseCode() + ': ' + r.getContentText());
  }
  props.setProperty('last', String(started));
}
`;

  if (me.user){ try { await api('/api/bands', { method:'POST', body:{ name:n } }); S.state = await api('/api/state'); render(); } catch(x){ toast(t('error')); } return; }
  if (await askPw(n, '/api/admin/band', { method:'POST', body:{ name:n } })) { S.state = await api('/api/state'); render(); } };
 $('#sgo').onchange = async e => { try { await api('/api/admin/signup', { method:'PUT', body:{ open: e.target.checked } }); S.state.signupOpen = e.target.checked; toast(t('saved')); } catch(x){ toast(t('error')); } };
 const rv = $('#rv'); if (rv) rv.onclick = async () => { if (!confirm(t('revert') + '?')) return; await api('/api/admin/app', { method:'DELETE' }); location.reload(); };
}


// ---------- members, invite link, account ----------
async function shareLink(url, title){
 if (navigator.share){ try { await navigator.share({ title, url }); return; } catch(e){ if (e && e.name === 'AbortError') return; } }
 try { await navigator.clipboard.writeText(url); toast(t('copied')); } catch(e){ prompt(title, url); }
}
function linkSheet(title, help, url){
 const sh = sheet(title, `<p class="muted small">${esc(help)}</p><input type="text" readonly dir="ltr" value="${esc(url)}" id="lnk" style="margin-bottom:10px">
  <div class="row"><button class="btn primary" id="shr">${t('share')}</button><button class="btn" id="cpl">${I.copy}</button></div>`);
 $('#shr', sh.el).onclick = () => shareLink(url, title);
 $('#cpl', sh.el).onclick = async () => { try { await navigator.clipboard.writeText(url); toast(t('copied')); } catch(e){ $('#lnk', sh.el).select(); } };
}
async function drawMembers(){
 const box = $('#mbox'); if (!box) return;
 let r; try { r = await api(`/api/band/${S.band.id}/members`); } catch(x){ box.textContent = ''; return; }
 if (!$('#mbox')) return;
 const man = ['owner','admin'].includes(r.myRole), me = S.state.me;
 const myId = (r.members.find(x => x.email && x.email === me.email) || {}).id;
 box.className = '';
 box.innerHTML = `<div class="muted small" style="margin-bottom:6px;font-weight:600">${t('membersTitle')}</div>
  ${r.members.length ? `<ul class="list" id="ml2">${r.members.map(x => `<li data-u="${x.id}"><div class="grow"><div class="title ell" dir="auto">${esc(x.name || '—')}${x.id === myId ? ` <span class="muted small">(${t('you')})</span>` : ''}</div>${x.email ? `<div class="muted small ell" dir="ltr">${esc(x.email)}</div>` : ''}</div>
    ${man ? `<select class="rl" style="width:auto"><option value="member" ${x.role==='member'?'selected':''}>${t('roleMember')}</option><option value="owner" ${x.role==='owner'?'selected':''}>${t('roleOwner')}</option></select>
     <button class="icon rs" title="${t('resetLink')}" aria-label="${t('resetLink')}">🔑</button><button class="icon rm" title="${t('removeMember')}" aria-label="${t('removeMember')}">${I.x}</button>`
     : `<span class="chip">${t(x.role === 'owner' ? 'roleOwner' : 'roleMember')}</span>`}</li>`).join('')}</ul>` : ''}
  ${man ? `<div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn primary" id="inv">${I.link} ${t('inviteLink')}</button>${r.invite.on ? `<button class="btn" id="invoff">${t('stopLink')}</button>` : ''}</div>
   ${r.invite.on ? `<p class="muted small">${t('linkUntil')} ${esc(new Date(r.invite.exp).toLocaleDateString(lang, { day:'numeric', month:'short' }))}</p>` : ''}
   <label class="f row" style="gap:8px;margin-top:10px"><input type="checkbox" id="lgy" style="width:auto" ${r.legacyOff ? '' : 'checked'}><span style="margin:0">${t('legacyAllow')}</span></label>`
  : myId ? `<p style="margin-top:10px"><button class="btn sm danger" id="leave">${t('leaveBand')}</button></p>` : ''}`;
 const ul = $('#ml2');
 if (ul && man){
  ul.onchange = async e => { const sel = e.target.closest('.rl'); if (!sel) return; const u = sel.closest('li').dataset.u;
   try { await api(`/api/band/${S.band.id}/members/${u}`, { method:'PUT', body:{ role: sel.value } }); toast(t('saved')); } catch(x){ toast(x.message === 'last_owner' ? t('lastOwner') : t('error')); drawMembers(); } };
  ul.onclick = async e => { const li = e.target.closest('li'); if (!li) return; const u = li.dataset.u;
   if (e.target.closest('.rs')){ try { const x = await api(`/api/band/${S.band.id}/members/${u}/reset`, { method:'POST' }); linkSheet(t('resetLink'), t('resetHelp'), `${location.origin}/#reset=${x.token}`); } catch(x){ toast(t('error')); } }
   if (e.target.closest('.rm')){ if (!confirm(t('removeMember') + '?')) return;
    try { await api(`/api/band/${S.band.id}/members/${u}`, { method:'DELETE' }); if (u === myId){ S.state = await api('/api/state'); return boot(); } drawMembers(); } catch(x){ toast(x.message === 'last_owner' ? t('lastOwner') : t('error')); } } };
 }
 const inv = $('#inv'); if (inv) inv.onclick = async () => { try { const x = await api(`/api/band/${S.band.id}/invite`, { method:'POST' }); linkSheet(t('inviteLink'), t('inviteHelp'), `${location.origin}/#invite=${x.token}`); drawMembers(); } catch(x){ toast(t('error')); } };
 const io = $('#invoff'); if (io) io.onclick = async () => { try { await api(`/api/band/${S.band.id}/invite`, { method:'DELETE' }); drawMembers(); } catch(x){ toast(t('error')); } };
 const lg = $('#lgy'); if (lg) lg.onchange = async e => { try { await api('/api/admin/band/' + S.band.id, { method:'PUT', body:{ legacyOff: !e.target.checked } }); toast(t('saved')); } catch(x){ toast(t('error')); e.target.checked = !e.target.checked; } };
 const lv = $('#leave'); if (lv) lv.onclick = async () => { if (!confirm(t('leaveBand') + '?')) return;
  try { await api(`/api/band/${S.band.id}/members/${myId}`, { method:'DELETE' }); localStorage.removeItem('band'); boot(); } catch(x){ toast(x.message === 'last_owner' ? t('lastOwner') : t('error')); } };
}
function editAccount(){
 const sh = sheet(t('changeAccount'), `<form id="acf"><label class="f"><span>${t('oldPw')}</span><input type="password" name="old" autocomplete="current-password" required></label>
  <label class="f"><span>${t('newEmail')}</span><input type="email" name="email" dir="ltr" placeholder="${esc(S.state.me.email)}"></label>
  <label class="f"><span>${t('newPw8')}</span><input type="password" name="pw" autocomplete="new-password" minlength="8"></label>
  <div class="err" id="acerr"></div><div class="row"><span class="grow"></span><button class="btn primary">${t('save')}</button></div></form>`);
 const f = $('#acf', sh.el);
 f.onsubmit = async e => { e.preventDefault();
  try { await api('/api/account', { method:'PUT', body:{ oldPassword: f.old.value, email: f.email.value.trim() || undefined, password: f.pw.value || undefined } });
   sh.close(); toast(t('saved')); S.state = await api('/api/state'); render(); }
  catch(x){ $('#acerr', sh.el).textContent = authErr(x.message); } };
}
function claimAccount(){
 const sh = sheet(t('claimTitle'), `<p class="muted small">${t('claimText')}</p><form id="clf">
  <label class="f"><span>${t('nameLbl')}</span><input type="text" name="name" required value="${esc(S.state.me.name || localStorage.getItem('myname') || '')}"></label>
  <label class="f"><span>${t('email')}</span><input type="email" name="email" dir="ltr" autocomplete="email" required></label>
  <label class="f"><span>${t('password')} <span class="muted">(${t('pwMin8')})</span></span><input type="password" name="pw" autocomplete="new-password" minlength="8" required></label>
  <div class="err" id="clerr"></div><div class="row"><span class="grow"></span><button class="btn primary">${t('create')}</button></div></form>`);
 const f = $('#clf', sh.el);
 f.onsubmit = async e => { e.preventDefault();
  try { await api('/api/account/claim', { method:'POST', body:{ name: f.name.value, email: f.email.value, password: f.pw.value } }); sh.close(); location.reload(); }
  catch(x){ $('#clerr', sh.el).textContent = authErr(x.message); } };
}

// refresh data when coming back to the app (not during stage mode or open editors)
document.addEventListener('visibilitychange', async () => {
 if (document.visibilityState !== 'visible' || !S.band || stageCtx || $('.sheet-bg')) return;
 await loadBand(); if (!$('.sheet-bg') && !stageCtx && document.activeElement?.id !== 'q') render();
});
window.addEventListener('online', () => { if (S.offline && S.band && !stageCtx && !$('.sheet-bg')) loadBand().then(render); });

boot();
</script>
